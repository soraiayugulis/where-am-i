ai:
  host: localhost
  port: 11434
  model: qwen2.5-coder:7b
  timeoutMs: 600000

git:
  branchPrefix: feature/ai-gen
  commitMessageFormat: conventional
  baseRef: HEAD~1

qualityGate:
  coverageThreshold: 0.0     # raise to 90 after adding kover
  coverageType: LINE
  timeoutSeconds: 1200       # Android build is heavy

build:
  gradleTasks:
    - testDebugUnitTest      # compiles + tests without lint/assembleRelease
  useDaemon: false
